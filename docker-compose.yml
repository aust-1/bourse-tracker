# Déploiement sur le VPS : `docker compose up -d --build` (le fichier .env est lu automatiquement).
#
# Le VPS héberge un reverse proxy Caddy partagé (ports 80/443) : ce fichier ne publie aucun
# port. Le routage vers ce service est déclaré dans ./Caddyfile (voir docs/DEPLOY.md du dépôt
# opt), qui cible l'alias réseau ci-dessous sur le réseau externe partagé.
name: bourse-tracker

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?manquant dans .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?manquant dans .env}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    networks:
      default: {}
      proxy:
        aliases:
          - bourse-web # cible du reverse_proxy dans ./Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?manquant dans .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-30000}
      STALE_AFTER_MS: ${STALE_AFTER_MS:-300000}
    logging: *logging

networks:
  # réseau partagé du proxy Caddy (créé par scripts/network-create.sh du dépôt opt)
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
