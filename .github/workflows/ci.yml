name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Base de données, intégration et e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer Supabase local (services minimaux)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,postgres-meta,mailpit
      - name: 'Tests de la base (pgTAP, RLS, contraintes, anti-vente à découvert)'
        run: supabase test db
      - name: Tests d'intégration du worker
        run: pnpm --filter @bourse/worker exec vitest run
        env:
          INTEGRATION: '1'
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests e2e
        run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
